name: Build and deploy frontend
on:
  push:
    branches: [deployment, deployment-prod]
jobs:
  deploy:
    runs-on: openfoto
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        shell: bash
        env:
          STAGING_CONFIG: ${{ secrets.STAGING_FRONTEND_CONFIG }}
          PRODUCTION_CONFIG: ${{ secrets.PRODUCTION_FRONTEND_CONFIG }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            deployment) ENVIRONMENT=staging; CONFIG="$STAGING_CONFIG"; CONFIG_SECRET=STAGING_FRONTEND_CONFIG ;;
            deployment-prod) ENVIRONMENT=production; CONFIG="$PRODUCTION_CONFIG"; CONFIG_SECRET=PRODUCTION_FRONTEND_CONFIG ;;
            *) printf 'Unsupported branch: %s\n' "$GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          missing=0
          if [ -z "$CONFIG" ]; then
            printf 'Missing Gitea Actions secret: %s\n' "$CONFIG_SECRET" >&2
            missing=1
          fi
          for name in REGISTRY_USER REGISTRY_PASSWORD KUBE_CONFIG; do
            if [ -z "${!name:-}" ]; then
              printf 'Missing Gitea Actions secret: %s\n' "$name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # Configuration is a trusted shell-format env file stored in Gitea.
          set -a
          source /dev/stdin <<< "$CONFIG"
          set +a
          : "${SITE:?}" "${BACKEND:?}" "${PHOTO_SOURCE:?}" "${PHOTO_BUCKET:?}" "${LOCALES:?}"
          mkdir -p "$HOME/.docker" "$HOME/.kube" /tmp/buildkit
          AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 -w 0)
          printf '{"auths":{"gitea.linkensphere.com":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config" "$HOME/.docker/config.json"
          curl -fsSL https://github.com/moby/buildkit/releases/download/v0.20.2/buildkit-v0.20.2.linux-amd64.tar.gz | tar -xz -C /tmp/buildkit
          curl -fsSL https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl -o /tmp/kubectl
          chmod +x /tmp/kubectl
          IMAGE="gitea.linkensphere.com/opan/frontend:${ENVIRONMENT}-${GITHUB_SHA}"
          /tmp/buildkit/bin/buildctl --addr tcp://buildkit.openfoto.svc:1234 build \
            --frontend dockerfile.v0 --local context=. --local dockerfile=. \
            --opt "build-arg:NODE_VERSION=$(tr -d '[:space:]' < .nvmrc)" \
            --opt "build-arg:SITE=$SITE" --opt "build-arg:BACKEND=$BACKEND" \
            --opt "build-arg:PHOTO_SOURCE=$PHOTO_SOURCE" --opt "build-arg:PHOTO_BUCKET=$PHOTO_BUCKET" \
            --opt "build-arg:GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY:-}" --opt "build-arg:GOOGLE_MAPS_ID=${GOOGLE_MAPS_ID:-}" \
            --opt "build-arg:LOCALES=$LOCALES" --output "type=image,name=$IMAGE,push=true"
          /tmp/kubectl -n openfoto set image "deployment/${ENVIRONMENT}-frontend" "frontend=$IMAGE"
          /tmp/kubectl -n openfoto rollout status "deployment/${ENVIRONMENT}-frontend" --timeout=5m
